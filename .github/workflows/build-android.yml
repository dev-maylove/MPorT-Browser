name: MPorT Browser Android

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  MPORT_URL: ${{ vars.MPORT_URL }}
  MPORT_API_URL: ${{ vars.MPORT_API_URL }}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Ensure Android platform + toolchain
        run: |
          flutter create . --project-name browser --org id.mport --platforms=android
          bash scripts/fix_android_toolchain.sh
          flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: |
          flutter build apk --release --tree-shake-icons \
            --dart-define=MPORT_URL=${{ env.MPORT_URL }} \
            --dart-define=MPORT_API_URL=${{ env.MPORT_API_URL }} \
            --dart-define=MPORT_AI=true

      - name: Build App Bundle
        run: |
          flutter build appbundle --release --tree-shake-icons \
            --dart-define=MPORT_URL=${{ env.MPORT_URL }} \
            --dart-define=MPORT_API_URL=${{ env.MPORT_API_URL }} \
            --dart-define=MPORT_AI=true

      - uses: actions/upload-artifact@v4
        with:
          name: MPorT-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MPorT-Android-AAB
          path: build/app/outputs/bundle/release/app-release.aab
