name: mport_browser
description: Premium MPorT Browser for MandalaNet ISP — multi-tab, privacy, search engines, AI.
publish_to: "none"
version: 2.0.8+8

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.7.0
  webview_flutter_wkwebview: ^3.22.0
  shared_preferences: ^2.5.3
  http: ^1.5.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  connectivity_plus: ^7.0.0
  crypto: ^3.0.6
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
