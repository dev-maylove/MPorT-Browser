buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        // AGP 9 built-in Kotlin defaults to its bundled KGP. Flutter 3.47.2
        // requires KGP >= 2.2.20, so pin a newer compatible KGP explicitly.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.20"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
